[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: нужен Docker, поднимает RabbitMQ через testcontainers
filterwarnings =
    # python-jose 3.3.0 внутри вызывает datetime.utcnow().
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose
    ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning

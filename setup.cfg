# Мутационное тестирование (ЛР № 10): mutmut run, затем mutmut results.
# Мутируется бизнес-логика — сервисы модулей и домен. Роутеры, репозитории и
# инфраструктуру проверяют API- и интеграционные тесты, unit-тесты их не видят.
[mutmut]
source_paths = app/
only_mutate =
    app/modules/*/service.py
    app/domain/*
pytest_add_cli_args_test_selection = tests/unit/
# Пакеты рядом с app/, которые импортируют app и tests/conftest.py.
also_copy =
    messaging/
    observability/
    delivery_service/
    delivery_grpc/
    scripts/
    pytest.ini

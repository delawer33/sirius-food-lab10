# Тесты на каждый пуш и PR. Джоба test — обязательная проверка ветки main:
# пока она красная, PR не смержить (настройка Branch protection в репозитории).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Без Docker: SQLite в памяти, fakeredis, gRPC-сервер в процессе.
      - name: Run unit and API tests
        run: pytest -m "not integration" --ignore=tests/integration -v

      # Docker на ubuntu-latest есть: Testcontainers сам поднимет PostgreSQL и RabbitMQ.
      - name: Run integration tests
        run: pytest tests/integration -v

      - name: Pact - consumer kitchen and provider monolith
        run: pytest tests/pact -v

      - name: Models match migrations
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head && alembic check
